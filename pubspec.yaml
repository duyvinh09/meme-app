name: meme_app
description: "Meme - Gen Z Social Expense Tracker & Visual Spending Diary combining Locket-style photo moments with smart financial management."
publish_to: "none"

version: 2.0.0+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.7.0
  firebase_auth: ^6.4.0
  cloud_firestore: ^6.3.0

  image_picker: ^1.1.2
  camera: ^0.12.0+1
  intl: ^0.20.2
  provider: ^6.1.2
  shared_preferences: ^2.5.3
  fl_chart: ^1.0.0
  uuid: ^4.5.1
  http: ^1.2.2
  image: ^4.2.0
  share_plus: ^13.3.0
  path_provider: ^2.1.5

  flutter_map: ^8.2.2
  latlong2: ^0.10.1
  geolocator: ^14.0.2
  geocoding: ^5.0.0

  crypto: ^3.0.3
  path: ^1.9.0
  url_launcher: ^6.3.1
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1

  video_thumbnail: ^0.5.3
  video_player: ^2.9.2
  light_compressor_v2: ^1.9.1
  translator: ^1.0.4+1
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  gal: ^2.3.3
  speech_to_text: ^7.4.0
  googleapis_auth: ^2.3.4
  record: ^6.2.1
  audioplayers: ^6.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: any

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/icons/
    - assets/sounds/
    - assets/fcm_service_account.json

#Icon app
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/memeapp_icon2.png"
  adaptive_icon_background: "#79AFFF"
  adaptive_icon_foreground: "assets/icons/memeapp_icon2.png"